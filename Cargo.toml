[package]
name = "hule"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = { version = "1", features = ["display", "parse", "serde"] }
serde_json = "1"
tempfile = "3"

[features]
nix-local-test-support = []

[[test]]
name = "nix_store_local"
path = "tests/nix_store_local.rs"
required-features = ["nix-local-test-support"]

[[test]]
name = "nix_generations"
path = "tests/nix_generations.rs"
required-features = ["nix-local-test-support"]

[[test]]
name = "nix_generations_local"
path = "tests/nix_generations_local.rs"
required-features = ["nix-local-test-support"]
